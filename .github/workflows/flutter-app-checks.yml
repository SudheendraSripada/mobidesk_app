name: Flutter app checks

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-app-checks.yml"
  push:
    branches:
      - "phase2/private-cloud-pc-api"
      - "build/mobidesk-verified-apk-2026-10-29"
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-app-checks.yml"

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test (demo-enabled test configuration)
        run: flutter test --concurrency=1 --dart-define=ALLOW_DEMO_MODE=true
      - name: Verify demo mode is disabled by default
        run: flutter test test/demo_mode_guard_test.dart --concurrency=1
      - name: Android Kotlin unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest
      - name: Build setup-preview universal APK
        run: flutter build apk --release --dart-define=ALLOW_SERVER_SETUP=true
      - name: Upload setup-preview APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiDesk-setup-preview-universal-\${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
