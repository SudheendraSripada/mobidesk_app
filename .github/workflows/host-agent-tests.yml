name: Host agent tests

on:
  pull_request:
    paths:
      - "server/host-agent/**"
      - ".github/workflows/host-agent-tests.yml"
  push:
    branches:
      - "phase2/private-cloud-pc-api"
    paths:
      - "server/host-agent/**"
      - ".github/workflows/host-agent-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/host-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/host-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run security tests
        run: pytest -q
