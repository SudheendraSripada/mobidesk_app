version: '3.8'

# ==============================================================================
# Apache Guacamole Docker Compose Stack for MobiDesk
# Runs guacd (proxy daemon), PostgreSQL database, and guacamole web application.
# ==============================================================================

services:
  # Guacamole proxy daemon handling native RDP connections
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: mobidesk_guacd
    restart: always
    networks:
      - guac_network

  # PostgreSQL database storing connections, users, and permissions
  postgres:
    image: postgres:15-alpine
    container_name: mobidesk_postgres
    restart: always
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-GuacSecureDbPass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - guac_network

  # Guacamole HTML5 web application
  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: mobidesk_guacamole
    restart: always
    depends_on:
      - guacd
      - postgres
    ports:
      - "8080:8080"
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-GuacSecureDbPass2026!}
    networks:
      - guac_network

volumes:
  postgres_data:
    name: mobidesk_guacamole_data

networks:
  guac_network:
    name: mobidesk_guac_net
    driver: bridge
